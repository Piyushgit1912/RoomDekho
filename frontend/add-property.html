<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Property – RoomZey</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVYx_qWBNaPbwmrfLw1-_zRPvps8bgQw4&libraries=places&callback=initAddPropertyMap"
    async defer></script>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="property-list.html">Listings</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline" id="loginBtn">Login</a>
    </div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="add-property-page">
    <div style="margin-bottom:2rem">
      <h1 style="font-size:2rem; margin-bottom:0.5rem">List Your Property 🏠</h1>
      <p style="color:var(--mid)">Fill in the details below to post your room, PG or flat for free</p>
    </div>

    <!-- Progress Steps -->
    <div class="steps-bar" style="max-width:500px; margin-bottom:2.5rem">
      <div class="step active" id="step1">
        <div class="step-dot">1</div>
        <div class="step-line"></div>
      </div>
      <div class="step" id="step2">
        <div class="step-dot">2</div>
        <div class="step-line"></div>
      </div>
      <div class="step" id="step3">
        <div class="step-dot">3</div>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="add-property-card">
      <!-- STEP 1: Basic Info -->
      <div id="formStep1">
        <h3 style="margin-bottom:1.5rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border)">📋 Basic
          Information</h3>

        <div class="form-group">
          <label class="form-label">Property Title *</label>
          <input type="text" class="form-input" id="title" placeholder="e.g. Spacious 1 BHK near IIT Delhi">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Room Type *</label>
            <select class="form-select" id="room_type">
              <option value="">Select type</option>
              <option value="single">Single Room</option>
              <option value="double">Double Sharing</option>
              <option value="triple">Triple Sharing</option>
              <option value="flat_1bhk">1 BHK Flat</option>
              <option value="flat_2bhk">2 BHK Flat</option>
              <option value="flat_3bhk">3 BHK Flat</option>
              <option value="pg">PG</option>
              <option value="hostel">Hostel</option>
              <option value="studio">Studio Apartment</option>
              <option value="other">Custom</option>

            </select>
            <div class="form-group" id="custom-room-group" style="display:none;">
              <label class="form-label">Custom Room Type</label>
              <input type="text" id="custom_room_type" class="form-input" placeholder="e.g. Villa, Duplex, Farm House">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Monthly Rent (₹) *</label>
            <input type="number" class="form-input" id="price" placeholder="e.g. 8000">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea class="form-textarea" id="description"
            placeholder="Describe your property — mention nearby landmarks, transport, house rules, etc."
            rows="5"></textarea>
          <div style="text-align:right; font-size:0.75rem; color:var(--mid)" id="descCount">0 / 500 characters</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Furnishing Status</label>
            <select class="form-select" id="furnished_status">
              <option value="unfurnished">Unfurnished</option>
              <option value="semi">Semi Furnished</option>
              <option value="furnished">Fully Furnished</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Gender Preference</label>
            <select class="form-select" id="gender_preference">
              <option value="any">Any (Co-ed)</option>
              <option value="male">Boys Only</option>
              <option value="female">Girls Only</option>
            </select>
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end">
          <button class="btn btn-primary" onclick="nextStep(2)">Continue →</button>
        </div>
      </div>

      <!-- STEP 2: Location & Amenities -->
      <div id="formStep2" style="display:none">
        <h3 style="margin-bottom:1.5rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border)">📍 Location &
          Amenities</h3>

        <div class="form-group">
          <label class="form-label">Full Address / Locality *</label>
          <input type="text" class="form-input" id="location" placeholder="e.g. Koramangala 5th Block">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">City *</label>
            <input type="text" list="cities" class="form-input" id="city">
            <datalist id="cities">
              <option value="">Select city</option>
              <option>Mumbai</option>
              <option>Delhi</option>
              <option>Bangalore</option>
              <option>Pune</option>
              <option>Hyderabad</option>
              <option>Chennai</option>
              <option>Kolkata</option>
              <option>Jaipur</option>
              <option>Ahmedabad</option>
              <option>Lucknow</option>
              <option>Indore</option>
              <option>Bhopal</option>
              <option>Chandigarh</option>
              <option>Nagpur</option>
            </datalist>

          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input type="text" class="form-input" id="state" placeholder="e.g. Karnataka">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-input" id="pincode" placeholder="560001" maxlength="6">
          </div>
          <div></div>
        </div>

        <!-- Google Maps Location Picker -->
        <div class="form-group" style="margin-top:0.5rem">
          <label class="form-label" style="margin-bottom:0.75rem">📍 Pin Location on Map <span
              style="font-weight:400; color:var(--mid)">(optional but recommended)</span></label>
          <div class="map-search-wrapper" style="margin-bottom:0.75rem">
            <span class="map-search-icon">🔍</span>
            <input type="text" class="form-input" id="mapSearchBox"
              placeholder="Search college, area, landmark, city...">
          </div>
          <div style="display:flex; gap:0.75rem; margin-bottom:0.75rem; flex-wrap:wrap">
            <button type="button" class="location-btn" id="useLocationBtn" onclick="useCurrentLocation()">
              📍 Use My Current Location
            </button>
          </div>
          <div class="map-container" id="addPropertyMap"></div>
          <div class="map-coords-display" id="coordsDisplay" style="display:none">
            <span id="latDisplay">Lat: —</span>
            <span id="lngDisplay">Lng: —</span>
          </div>
          <input type="hidden" id="latitude" value="">
          <input type="hidden" id="longitude" value="">
        </div>

        <div class="form-group">
          <label class="form-label" style="margin-bottom:0.75rem">Available Amenities</label>
          <div class="amenities-grid">
            <div class="amenity-toggle"><input type="checkbox" id="wifi" name="amenity"><label
                class="amenity-toggle-label" for="wifi"><span style="font-size:1.4rem">📶</span>WiFi</label></div>
            <div class="amenity-toggle"><input type="checkbox" id="ac" name="amenity"><label
                class="amenity-toggle-label" for="ac"><span style="font-size:1.4rem">❄️</span>AC</label></div>
            <div class="amenity-toggle"><input type="checkbox" id="parking" name="amenity"><label
                class="amenity-toggle-label" for="parking"><span style="font-size:1.4rem">🚗</span>Parking</label></div>
            <div class="amenity-toggle"><input type="checkbox" id="food" name="amenity"><label
                class="amenity-toggle-label" for="food"><span style="font-size:1.4rem">🍽️</span>Meals</label></div>
            <div class="amenity-toggle"><input type="checkbox" id="gym" name="amenity"><label
                class="amenity-toggle-label" for="gym"><span style="font-size:1.4rem">💪</span>Gym</label></div>
            <div class="amenity-toggle"><input type="checkbox" id="security" name="amenity"><label
                class="amenity-toggle-label" for="security"><span style="font-size:1.4rem">🔒</span>Security</label>
            </div>
            <div class="amenity-toggle"><input type="checkbox" id="laundry" name="amenity"><label
                class="amenity-toggle-label" for="laundry"><span style="font-size:1.4rem">👕</span>Laundry</label></div>
          </div>
