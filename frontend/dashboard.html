<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – RoomZey</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="property-list.html">Listings</a></li>
    </ul>
    <div class="nav-actions">
      <a href="add-property.html" class="btn btn-primary" id="navAddPropBtn">+ List Property</a>
      <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
    </div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="dashboard-page">
    <!-- Header -->
    <div class="dashboard-header">
      <h1 style="font-size:2rem; margin-bottom:0.25rem" id="dashGreeting">Dashboard</h1>
      <p style="color:var(--mid)" id="dashRole">Loading...</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div style="grid-column:1/-1;text-align:center;padding:2rem">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:2rem; overflow-x:auto">
      <button class="tab-btn active" data-tab="properties" onclick="switchTab(this)">🏠 My Properties</button>
      <button class="tab-btn" data-tab="favorites" onclick="switchTab(this)">❤️ Saved</button>
      <button class="tab-btn" data-tab="inquiries" onclick="switchTab(this)">📩 Inquiries</button>
      <button class="tab-btn" data-tab="profile" onclick="switchTab(this)">👤 Profile</button>
      <!-- <button class="tab-btn" data-tab="admin-approvals" id="tabBtnAdmin" style="display:none" onclick="switchTab(this)">👑 Admin Approvals</button> -->
    </div>

    <style>
      .tab-btn {
        background: none;
        border: none;
        padding: 0.75rem 1.25rem;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--mid);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .tab-btn.active {
        color: var(--brand);
        border-bottom-color: var(--brand);
      }

      .tab-btn:hover:not(.active) {
        color: var(--dark);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        text-align: left;
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mid);
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tr:hover td {
        background: var(--light);
      }
    </style>

    <!-- Tabs Content -->
    <div id="tab-properties">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem">
        <h3>My Listings</h3>
        <a href="add-property.html" class="btn btn-primary" style="font-size:0.85rem" id="tabAddPropBtn">+ Add New</a>
      </div>
      <div id="myPropertiesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-favorites" style="display:none">
      <h3 style="margin-bottom:1.25rem">Saved Properties</h3>
      <div id="favoritesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-inquiries" style="display:none">
      <h3 style="margin-bottom:1.25rem">Inquiries</h3>
      <div id="inquiriesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-profile" style="display:none">
      <h3 style="margin-bottom:1.5rem">My Profile</h3>
      <div id="profileContent">
        <div class="spinner"></div>
      </div>
    </div>

    <!--
  <div id="tab-admin-approvals" style="display:none">
    <h3 style="margin-bottom:1.25rem">Pending Approvals</h3>
    <div id="adminApprovalsContent"><div class="spinner"></div></div>
  </div>
  -->
  </div>

  <footer>
    <div class="footer-bottom">© 2025 RoomZey · <a href="index.html" style="color:var(--brand)">Home</a></div>
  </footer>

  <script src="../static/js/api.js"></script>
  <script>
    if (!api.isLoggedIn()) window.location.href = 'login.html?next=dashboard.html';

    const user = api.user;
    const isAdmin = api.isAdmin();

    document.getElementById('dashGreeting').textContent = `Hello, ${user?.name?.split(' ')[0] || 'there'} 👋`;
