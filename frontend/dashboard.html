<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – RoomZey</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="property-list.html">Listings</a></li>
    </ul>
    <div class="nav-actions">
      <a href="add-property.html" class="btn btn-primary" id="navAddPropBtn">+ List Property</a>
      <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
    </div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div class="dashboard-page">
    <!-- Header -->
    <div class="dashboard-header">
      <h1 style="font-size:2rem; margin-bottom:0.25rem" id="dashGreeting">Dashboard</h1>
      <p style="color:var(--mid)" id="dashRole">Loading...</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div style="grid-column:1/-1;text-align:center;padding:2rem">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:2rem; overflow-x:auto">
      <button class="tab-btn active" data-tab="properties" onclick="switchTab(this)">🏠 My Properties</button>
      <button class="tab-btn" data-tab="favorites" onclick="switchTab(this)">❤️ Saved</button>
      <button class="tab-btn" data-tab="inquiries" onclick="switchTab(this)">📩 Inquiries</button>
      <button class="tab-btn" data-tab="profile" onclick="switchTab(this)">👤 Profile</button>
      <!-- <button class="tab-btn" data-tab="admin-approvals" id="tabBtnAdmin" style="display:none" onclick="switchTab(this)">👑 Admin Approvals</button> -->
    </div>

    <style>
      .tab-btn {
        background: none;
        border: none;
        padding: 0.75rem 1.25rem;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--mid);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .tab-btn.active {
        color: var(--brand);
        border-bottom-color: var(--brand);
      }

      .tab-btn:hover:not(.active) {
        color: var(--dark);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        text-align: left;
        padding: 0.75rem 1rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mid);
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tr:hover td {
        background: var(--light);
      }
    </style>

    <!-- Tabs Content -->
    <div id="tab-properties">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem">
        <h3>My Listings</h3>
        <a href="add-property.html" class="btn btn-primary" style="font-size:0.85rem" id="tabAddPropBtn">+ Add New</a>
      </div>
      <div id="myPropertiesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-favorites" style="display:none">
      <h3 style="margin-bottom:1.25rem">Saved Properties</h3>
      <div id="favoritesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-inquiries" style="display:none">
      <h3 style="margin-bottom:1.25rem">Inquiries</h3>
      <div id="inquiriesContent">
        <div class="spinner"></div>
      </div>
    </div>

    <div id="tab-profile" style="display:none">
      <h3 style="margin-bottom:1.5rem">My Profile</h3>
      <div id="profileContent">
        <div class="spinner"></div>
      </div>
    </div>

    <!--
  <div id="tab-admin-approvals" style="display:none">
    <h3 style="margin-bottom:1.25rem">Pending Approvals</h3>
    <div id="adminApprovalsContent"><div class="spinner"></div></div>
  </div>
  -->
  </div>

  <footer>
    <div class="footer-bottom">© 2025 RoomZey · <a href="index.html" style="color:var(--brand)">Home</a></div>
  </footer>

  <script src="../static/js/api.js"></script>
  <script>
    if (!api.isLoggedIn()) window.location.href = 'login.html?next=dashboard.html';

    const user = api.user;
    const isAdmin = api.isAdmin();

    document.getElementById('dashGreeting').textContent = `Hello, ${user?.name?.split(' ')[0] || 'there'} 👋`;
    // Commented out Admin check in role title
    /*
    if (isAdmin) {
      document.getElementById('dashRole').textContent = 'System Administrator';
      document.getElementById('tabBtnAdmin').style.display = 'block';
    } else {
      document.getElementById('dashRole').textContent = user?.user_type === 'owner' ? 'Property Owner Dashboard' : 'Tenant Dashboard';
    }
    */
    document.getElementById('dashRole').textContent = user?.user_type === 'owner' ? 'Property Owner Dashboard' : 'Tenant Dashboard';

    // Hide add-property buttons for tenants
    const isTenantUser = user?.user_type === 'tenant';
    if (isTenantUser) {
      const navAddBtn = document.getElementById('navAddPropBtn');
      if (navAddBtn) navAddBtn.style.display = 'none';
      const tabAddBtn = document.getElementById('tabAddPropBtn');
      if (tabAddBtn) tabAddBtn.style.display = 'none';
    }

    function switchTab(btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      // Commented out admin-approvals from standard tab switching
      ['properties', 'favorites', 'inquiries', 'profile'/*, 'admin-approvals'*/].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.style.display = t === tab ? 'block' : 'none';
      });
      if (tab === 'favorites') loadFavs();
      if (tab === 'inquiries') loadInquiries();
      if (tab === 'profile') loadProfile();
      // if (tab === 'admin-approvals') loadAdminApprovals();
    }

    const statusBadge = s => {
      const colors = { approved: '#10B981', pending: '#F59E0B', rejected: '#EF4444' };
      return `<span style="background:${colors[s] || '#6B7280'}20;color:${colors[s] || '#6B7280'};padding:3px 10px;border-radius:50px;font-size:0.75rem;font-weight:600;text-transform:capitalize">${s}</span>`;
    };

    async function loadStats() {
      try {
        const props = await api.get('/my-properties/');
        const favs = await api.get('/favorites/');
        const inquiries = await api.get('/my-inquiries/');
        document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-card-num">${props.length || 0}</div><div class="stat-card-label">My Listings</div></div>
      <div class="stat-card"><div class="stat-card-num">${favs.length || 0}</div><div class="stat-card-label">Saved Properties</div></div>
      <div class="stat-card"><div class="stat-card-num">${inquiries.length || 0}</div><div class="stat-card-label">Inquiries Sent</div></div>
      <div class="stat-card"><div class="stat-card-num">${props.filter(p => p.status === 'approved').length || 0}</div><div class="stat-card-label">Active Listings</div></div>
    `;
        renderMyProperties(props);
      } catch (e) {
        document.getElementById('statsGrid').innerHTML = '';
        document.getElementById('myPropertiesContent').innerHTML = `<div class="alert alert-error">Could not load data. Make sure backend is running.</div>`;
      }
    }

    function renderMyProperties(props) {
      const isTenantUser = user?.user_type === 'tenant';
      if (!props.length) {
        if (isTenantUser) {
          document.getElementById('myPropertiesContent').innerHTML = `<div class="empty-state"><div class="empty-icon">🏠</div><div class="empty-title">No listings</div><p style="color:var(--mid); font-size:0.9rem">Only Property Owners can add listings. Browse available rooms instead.</p><a href="property-list.html" class="btn btn-primary mt-2">Browse Listings</a></div>`;
        } else {
          document.getElementById('myPropertiesContent').innerHTML = `<div class="empty-state"><div class="empty-icon">🏠</div><div class="empty-title">No listings yet</div><a href="add-property.html" class="btn btn-primary mt-2">List Your First Property</a></div>`;
        }
        return;
      }
      document.getElementById('myPropertiesContent').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Property</th><th>Type</th><th>Price</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody>
          ${props.map(p => `
            <tr>
              <td><div style="font-weight:600">${p.title}</div><div style="font-size:0.8rem;color:var(--mid)">📍 ${p.city}</div></td>
              <td style="text-transform:capitalize">${p.room_type?.replace('_', ' ')}</td>
              <td style="font-weight:600;color:var(--brand)">${formatPrice(p.price)}/mo</td>
              <td>${statusBadge(p.status)}</td>
              <td style="font-size:0.85rem;color:var(--mid)">${new Date(p.created_at).toLocaleDateString('en-IN')}</td>
              <td>
                <div style="display:flex;gap:6px">
                  <a href="property-details.html?id=${p.id}" class="btn btn-ghost" style="padding:4px 10px;font-size:0.8rem">View</a>
                  <button onclick="deleteProperty(${p.id})" class="btn btn-ghost" style="padding:4px 10px;font-size:0.8rem;color:#EF4444">Delete</button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
    }

    async function deleteProperty(id) {
      if (!confirm('Are you sure you want to delete this listing?')) return;
      try {
        await api.delete(`/delete-property/${id}/`);
        toast('Property deleted', 'success');
        loadStats();
      } catch (e) { toast('Failed to delete', 'error'); }
    }

    async function loadFavs() {
      const el = document.getElementById('favoritesContent');
      try {
        const favs = await api.get('/favorites/');
        if (!favs.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">❤️</div><div class="empty-title">No saved properties</div><a href="property-list.html" class="btn btn-primary mt-2">Browse listings</a></div>`; return; }
        el.innerHTML = `<div class="properties-grid">${favs.map(f => `
      <div class="property-card" onclick="window.location.href='property-details.html?id=${f.property}'">
        <div class="card-body">
          <div class="card-price">${formatPrice(f.property_price)} <span>/ month</span></div>
          <div class="card-title">${f.property_title}</div>
          <div class="card-location">📍 ${f.property_city}</div>
        </div>
      </div>
    `).join('')}</div>`;
      } catch (e) { el.innerHTML = `<div class="alert alert-error">Failed to load favorites.</div>`; }
    }

    async function loadInquiries() {
      const el = document.getElementById('inquiriesContent');
      try {
        const inqs = await api.get('/my-inquiries/');
        if (!inqs.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">📩</div><div class="empty-title">No inquiries yet</div><a href="property-list.html" class="btn btn-primary mt-2">Browse and Inquire</a></div>`; return; }
        el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Property</th><th>Message</th><th>Contact</th><th>Status</th><th>Date</th></tr></thead>
      <tbody>
        ${inqs.map(i => `<tr>
          <td><div style="font-weight:600">${i.property_title}</div><div style="font-size:0.8rem;color:var(--mid)">${i.property_city}</div></td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.message}</td>
          <td>${i.contact_number}</td>
          <td>${statusBadge(i.status)}</td>
          <td style="font-size:0.8rem;color:var(--mid)">${new Date(i.date).toLocaleDateString('en-IN')}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
      } catch (e) { el.innerHTML = `<div class="alert alert-error">Failed to load inquiries.</div>`; }
    }

    async function loadProfile() {
      const el = document.getElementById('profileContent');
      try {
        const user = await api.get('/profile/');
        el.innerHTML = `
      <div style="max-width:500px">
        <div class="add-property-card">
          <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)">
            <div style="width:72px;height:72px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem">
              ${(user.name || 'U')[0].toUpperCase()}
            </div>
            <div>
              <div style="font-size:1.25rem;font-weight:700">${user.name}</div>
              <div style="color:var(--mid);font-size:0.9rem">${user.email}</div>
              <span style="background:var(--brand-light);color:var(--brand);font-size:0.75rem;font-weight:600;padding:2px 10px;border-radius:50px;text-transform:capitalize">${user.user_type}</span>
            </div>
