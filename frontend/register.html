<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – RoomZey</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
  <div class="nav-actions">
    <a href="login.html" class="btn btn-outline">Sign In</a>
  </div>
</nav>

<div class="form-page">
  <div class="form-card fade-in" style="max-width:520px">
    <h2 class="form-title">Join RoomZey 🏠</h2>
    <p class="form-subtitle">Create your free account to find or list rooms</p>

    <div id="alertBox"></div>

    <!-- Role Selection -->
    <div class="user-type-select">
      <div class="type-option">
        <input type="radio" name="user_type" id="typeTenant" value="tenant" checked>
        <label class="type-label" for="typeTenant">
          <span class="type-icon">🎓</span>
          <span>I'm a Tenant</span>
          <span style="font-size:0.75rem; opacity:0.7">Looking for room</span>
        </label>
      </div>
      <div class="type-option">
        <input type="radio" name="user_type" id="typeOwner" value="owner">
        <label class="type-label" for="typeOwner">
          <span class="type-icon">🏠</span>
          <span>I'm an Owner</span>
          <span style="font-size:0.75rem; opacity:0.7">Listing property</span>
        </label>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" class="form-input" id="name" placeholder="Rahul Sharma">
      </div>
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" class="form-input" id="username" placeholder="rahul_sharma">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address *</label>
      <input type="email" class="form-input" id="email" placeholder="rahul@example.com">
    </div>

    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input type="tel" class="form-input" id="phone" placeholder="+91 98765 43210">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" class="form-input" id="password" placeholder="Min. 8 characters">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" class="form-input" id="password2" placeholder="Repeat password">
      </div>
    </div>

    <!-- Password strength -->
    <div id="strengthBar" style="margin-top:-0.75rem; margin-bottom:1rem; display:none">
      <div style="height:4px; border-radius:2px; background:var(--border); overflow:hidden">
        <div id="strengthFill" style="height:100%; width:0; transition:all 0.3s; border-radius:2px"></div>
      </div>
      <div id="strengthLabel" style="font-size:0.75rem; color:var(--mid); margin-top:4px"></div>
    </div>

    <div style="margin-bottom:1.5rem">
      <label style="display:flex; align-items:flex-start; gap:10px; cursor:pointer; font-size:0.85rem; color:var(--mid)">
        <input type="checkbox" id="terms" style="margin-top:3px; accent-color:var(--brand)">
        <span>I agree to the <a href="#" style="color:var(--brand)">Terms of Use</a> and <a href="#" style="color:var(--brand)">Privacy Policy</a></span>
      </label>
    </div>

    <button class="btn btn-primary btn-full" onclick="doRegister()" id="regBtn">Create Account</button>

    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--mid)">
      Already have an account? <a href="login.html" style="color:var(--brand); font-weight:600">Sign in</a>
    </p>
  </div>
</div>

<script src="../static/js/api.js"></script>
<script>
if (api.isLoggedIn()) window.location.href = 'index.html';

document.getElementById('password').addEventListener('input', function() {
  const val = this.value;
  const bar = document.getElementById('strengthBar');
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (!val) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  let strength = 0;
  if (val.length >= 8) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  if (/[^A-Za-z0-9]/.test(val)) strength++;
  const levels = [{w:'25%',c:'#EF4444',l:'Weak'},{w:'50%',c:'#F59E0B',l:'Fair'},{w:'75%',c:'#3B82F6',l:'Good'},{w:'100%',c:'#10B981',l:'Strong'}];
  const lv = levels[Math.min(strength-1, 3)] || levels[0];
  fill.style.width = lv.w; fill.style.background = lv.c;
  label.textContent = `Password strength: ${lv.l}`; label.style.color = lv.c;
});

async function doRegister() {
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';
  const btn = document.getElementById('regBtn');

  const data = {
    name: document.getElementById('name').value.trim(),
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
    password2: document.getElementById('password2').value,
    user_type: document.querySelector('[name="user_type"]:checked')?.value || 'tenant'
  };

  if (!data.name || !data.username || !data.email || !data.password) {
    alertBox.innerHTML = `<div class="alert alert-error">Please fill in all required fields.</div>`;
    return;
  }
  if (data.password !== data.password2) {
    alertBox.innerHTML = `<div class="alert alert-error">Passwords do not match.</div>`;
    return;
  }
  if (!document.getElementById('terms').checked) {
    alertBox.innerHTML = `<div class="alert alert-error">Please accept the Terms of Use.</div>`;
    return;
  }

  btn.disabled = true; btn.textContent = 'Creating account…';

  try {
    const res = await api.post('/register/', data);
    api.setAuth(res.token, res.user);
    toast('Account created! Welcome to RoomZey 🎉', 'success');
    setTimeout(() => window.location.href = data.user_type === 'owner' ? 'add-property.html' : 'property-list.html', 1000);
  } catch(e) {
    let msg = 'Registration failed. ';
