<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details – RoomZey</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDVYx_qWBNaPbwmrfLw1-_zRPvps8bgQw4&callback=Function.prototype"
    async defer></script>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="property-list.html">Listings</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Get Started</a>
    </div>
    <div class="hamburger"><span></span><span></span><span></span></div>
  </nav>

  <div style="margin-top:72px; padding:1.5rem 2rem; max-width:1100px; margin-left:auto; margin-right:auto">
    <a href="property-list.html"
      style="display:inline-flex; align-items:center; gap:6px; color:var(--mid); font-size:0.9rem; margin-top:72px">←
      Back to listings</a>
  </div>

  <div id="detailContent">
    <div style="text-align:center; padding:4rem">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Inquiry Modal -->
  <div class="modal-overlay" id="inquiryModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3 style="margin-bottom:0.5rem">Send Inquiry</h3>
      <p style="color:var(--mid); font-size:0.9rem; margin-bottom:1.5rem">The owner will contact you back shortly</p>

      <div class="form-group">
        <label class="form-label">Your Message *</label>
        <textarea class="form-textarea" id="inquiryMsg"
          placeholder="Hi, I am interested in this property. Please provide more details..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Contact Number *</label>
        <input type="tel" class="form-input" id="inquiryPhone" placeholder="Your phone number">
      </div>
      <div class="form-group">
        <label class="form-label">Preferred Visit Date</label>
        <input type="date" class="form-input" id="inquiryDate" min="">
      </div>
      <div id="inquiryAlert"></div>
      <button class="btn btn-primary btn-full" onclick="sendInquiry()">Send Inquiry</button>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-prev" onclick="lightboxNav(-1)">‹</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Property photo">
    <button class="lightbox-next" onclick="lightboxNav(1)">›</button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>

  <footer>
    <div class="footer-bottom">© 2026 RoomZey · <a href="index.html" style="color:var(--brand)">Home</a></div>
  </footer>

  <script src="../static/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const propertyId = urlParams.get('id');
    let property = null;

    if (!propertyId) window.location.href = 'property-list.html';

    async function loadProperty() {
      try {
        property = await api.get(`/properties/${propertyId}/`);
        renderProperty(property);
        loadReviews();
        // Init map after render if coordinates exist
        if (property.latitude && property.longitude) {
          setTimeout(() => initDetailMap(property), 300);
        }
      } catch (e) {
        document.getElementById('detailContent').innerHTML = `
      <div class="empty-state"><div class="empty-icon">⚠️</div>
        <div class="empty-title">Property not found</div>
        <a href="property-list.html" class="btn btn-primary mt-2">Browse listings</a>
      </div>`;
      }
    }

    function renderProperty(p) {
      document.title = `${p.title} – RoomZey`;
      const imgs = p.images || [];
      const videos = p.videos || [];
      const fallback = 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800&q=80';
      const mainImg = imgs[0]?.image_url || fallback;
      const sideImgs = imgs.slice(1, 5);
      // Build gallery image URLs for lightbox
      window._galleryImages = imgs.map(i => i.image_url || fallback);
      if (!window._galleryImages.length) window._galleryImages = [fallback];

      const isOwnListing = api.isLoggedIn() && api.user?.id === p.owner;

      const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
      const amenities = [
        { key: 'wifi', icon: '📶', label: 'WiFi' },
        { key: 'ac', icon: '❄️', label: 'AC' },
        { key: 'parking', icon: '🚗', label: 'Parking' },
        { key: 'food', icon: '🍽️', label: 'Meals' },
        { key: 'gym', icon: '💪', label: 'Gym' },
        { key: 'security', icon: '🔒', label: 'Security' },
        { key: 'laundry', icon: '👕', label: 'Laundry' },
      ];

      const typeMap = { single: 'Single Room', double: 'Double Sharing', triple: 'Triple Sharing', flat_1bhk: '1 BHK Flat', flat_2bhk: '2 BHK Flat', flat_3bhk: '3 BHK Flat', pg: 'PG', hostel: 'Hostel', studio: 'Studio' };
      const roomType = p.room_type === 'other' ? (p.custom_room_type || 'Other') : (typeMap[p.room_type] || p.room_type);
      document.getElementById('detailContent').innerHTML = `
    <div style="max-width:1100px; margin:0 auto; padding:0 2rem 4rem">
      <!-- Gallery -->
      <div class="property-gallery" style="margin-bottom:2rem">
        <div class="gallery-main" onclick="openLightbox(0)">
          <img src="${mainImg}" alt="${p.title}" onerror="this.src='${fallback}'" style="object-fit:cover">
        </div>
        <div class="gallery-side">
          ${sideImgs.length > 0 ? sideImgs.map((img, i) => `<img src="${img.image_url}" alt="" onclick="openLightbox(${i + 1})" onerror="this.src='${fallback}'" style="object-fit:cover">`).join('') : `<img src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=400&q=80" alt=""><img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400&q=80" alt="">`}
          ${sideImgs.length === 1 ? `<img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400&q=80" alt="">` : ''}
        </div>
        ${imgs.length > 3 ? `<button class="gallery-show-all" onclick="openLightbox(0)">📷 Show All ${imgs.length} Photos</button>` : ''}
      </div>
      ${videos.length > 0 ? `
      <div style="background:white; border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem">
       <h3 style="margin-bottom:1rem">🎥 Property Video</h3>
      
       <video
         controls
         width="100%"
         style="border-radius:12px; max-height:500px; background:#000;"
       >
         <source src="${videos[0].video_url}" type="video/mp4">
         Your browser does not support video playback.
       </video>
     
      </div>
      ` : ''}
      <div class="detail-layout" style="padding:0">
        <!-- Main Content -->
        <div>
          <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem">
            <div>
              <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:0.75rem">
                <span style="background:var(--brand);color:white;padding:4px 12px;border-radius:50px;font-size:0.8rem;font-weight:600">${typeMap[p.room_type] || p.room_type}</span>
                <span style="background:var(--light);color:var(--mid);padding:4px 12px;border-radius:50px;font-size:0.8rem;border:1px solid var(--border)">${p.furnished_status}</span>
                ${p.gender_preference !== 'any' ? `<span style="background:var(--light);color:var(--mid);padding:4px 12px;border-radius:50px;font-size:0.8rem;border:1px solid var(--border)">${p.gender_preference === 'male' ? 'Boys Only' : 'Girls Only'}</span>` : ''}
              </div>
              <h1 style="font-size:1.75rem; margin-bottom:0.5rem">${p.title}</h1>
              <div style="display:flex; align-items:center; gap:6px; color:var(--mid)">
                <span>📍</span> <span>${p.location}, ${p.city}${p.state ? ', ' + p.state : ''}</span>
              </div>
            </div>
            <div>
              <div style="font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; color:var(--brand)">
                ${formatPrice(p.price)} <span style="font-size:0.9rem; color:var(--mid); font-family:'DM Sans',sans-serif; font-weight:400">/ month</span>
              </div>
              <div style="display:flex; align-items:center; gap:6px; margin-top:4px">
                <span style="color:#F59E0B; font-size:1rem">${stars(Math.round(p.avg_rating || 0))}</span>
                <span style="font-weight:600">${p.avg_rating || '—'}</span>
                <span style="color:var(--mid); font-size:0.85rem">(${p.review_count || 0} reviews)</span>
              </div>
            </div>
          </div>
          
          <!-- Description -->
          <div style="background:white; border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem">
            <h3 style="margin-bottom:1rem">About This Property</h3>
            <p style="color:var(--mid); line-height:1.8">${p.description}</p>
          </div>

          <!-- Amenities -->
          <div style="background:white; border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem">
            <h3 style="margin-bottom:1rem">Amenities</h3>
            <div class="amenity-grid">
              ${amenities.map(a => `
                <div class="amenity-item ${p[a.key] ? 'active' : ''}">
                  <span class="amenity-icon">${a.icon}</span>
                  <span>${a.label}</span>
                  ${p[a.key] ? '' : '<span style="font-size:0.7rem;opacity:0.5">Not available</span>'}
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Map Section -->
          ${p.latitude && p.longitude ? `
          <div class="detail-map-section">
            <h3 style="margin-bottom:0.25rem">🗺️ Location on Map</h3>
            <p style="color:var(--mid); font-size:0.85rem">${p.location}, ${p.city}</p>
            <div class="map-container" id="detailMap"></div>
            <div class="detail-map-actions">
              <a href="https://www.google.com/maps?q=${p.latitude},${p.longitude}" target="_blank" rel="noopener" class="btn btn-primary" style="font-size:0.85rem">
                📍 Open in Google Maps
              </a>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}" target="_blank" rel="noopener" class="btn btn-outline" style="font-size:0.85rem">
                🛣 Get Directions
              </a>
            </div>
          </div>
          ` : `
          <div class="no-location-msg">
            <span style="font-size:1.2rem">📍</span>
            <span>Exact map location not available for this property. Contact the owner for directions.</span>
          </div>
          `}
          
          <!-- Reviews -->
          <div style="background:white; border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem">
              <h3>Reviews & Ratings</h3>
              ${api.isLoggedIn() ? `<button class="btn btn-outline" onclick="showReviewForm()" style="font-size:0.85rem">Write Review</button>` : `<a href="login.html" class="btn btn-ghost" style="font-size:0.85rem">Login to Review</a>`}
            </div>
            
            <!-- Review form (hidden) -->
            <div id="reviewForm" style="display:none; background:var(--light); border-radius:var(--radius-sm); padding:1.25rem; margin-bottom:1.5rem; border:1px solid var(--border)">
              <h4 style="margin-bottom:1rem">Your Review</h4>
              <div style="display:flex; gap:8px; margin-bottom:1rem" id="ratingStars">
                ${[1, 2, 3, 4, 5].map(n => `<button onclick="setRating(${n})" data-val="${n}" style="font-size:1.5rem; background:none; border:none; cursor:pointer; transition:transform 0.1s">☆</button>`).join('')}
              </div>
              <textarea class="form-textarea" id="reviewComment" placeholder="Share your experience..." style="margin-bottom:0.75rem"></textarea>
              <div id="reviewAlert"></div>
              <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
            </div>

            <div id="reviewsList"><div class="spinner" style="width:30px;height:30px;border-width:2px"></div></div>
          </div>
        </div>

        <!-- Sidebar -->
        <div>
          <div class="contact-card">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:1.25rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border)">
              <div style="width:48px;height:48px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem">
                ${(p.owner_name || 'O')[0].toUpperCase()}
              </div>
              <div>
                <div style="font-weight:600">${p.owner_name || 'Property Owner'}</div>
                <div style="font-size:0.8rem; color:var(--mid)">Property Owner</div>
              </div>
            </div>

            ${api.isLoggedIn() ? `
              <div style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1.25rem">
                ${p.contact_phone || p.owner_phone ? `<a href="tel:${p.contact_phone || p.owner_phone}" class="btn btn-outline" style="justify-content:center">📞 ${p.contact_phone || p.owner_phone}</a>` : ''}
                ${p.contact_email || p.owner_email ? `<a href="mailto:${p.contact_email || p.owner_email}" class="btn btn-ghost" style="justify-content:center">✉️ Send Email</a>` : ''}
              </div>
            ` : `
              <div class="alert alert-info" style="margin-bottom:1rem; font-size:0.85rem">
                <a href="login.html" style="color:inherit; font-weight:600">Login</a> to view contact details
              </div>
            `}

            ${isOwnListing ? `
              <div class="own-listing-badge">
                <span>🏠</span> This is your listing
              </div>
            ` : `
              <button class="btn btn-primary btn-full" onclick="openInquiry()">📩 Send Inquiry</button>
            `}
            <button class="btn btn-ghost btn-full mt-1" onclick="toggleFavorite(${p.id}, this)">🤍 Save to Favorites</button>

            <div style="margin-top:1.25rem; padding-top:1.25rem; border-top:1px solid var(--border)">
              <div style="font-size:0.8rem; color:var(--mid); margin-bottom:0.5rem">Details</div>
              <div style="display:flex; flex-direction:column; gap:8px; font-size:0.9rem">
                <div style="display:flex; justify-content:space-between"><span style="color:var(--mid)">Type</span><span style="font-weight:500">${typeMap[p.room_type] || p.room_type}</span></div>
                <div style="display:flex; justify-content:space-between"><span style="color:var(--mid)">Furnishing</span><span style="font-weight:500">${p.furnished_status}</span></div>
                <div style="display:flex; justify-content:space-between"><span style="color:var(--mid)">For</span><span style="font-weight:500">${p.gender_preference === 'any' ? 'Co-ed' : p.gender_preference === 'male' ? 'Boys' : 'Girls'}</span></div>
                <div style="display:flex; justify-content:space-between"><span style="color:var(--mid)">City</span><span style="font-weight:500">${p.city}</span></div>
                <div style="display:flex; justify-content:space-between"><span style="color:var(--mid)">Listed</span><span style="font-weight:500">${new Date(p.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
    }

    let selectedRating = 0;
    function setRating(n) {
      selectedRating = n;
      document.querySelectorAll('#ratingStars button').forEach((btn, i) => {
        btn.textContent = i < n ? '★' : '☆';
        btn.style.color = i < n ? '#F59E0B' : 'var(--mid)';
      });
    }

    function showReviewForm() {
      const form = document.getElementById('reviewForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function submitReview() {
      if (!selectedRating) { toast('Please select a rating', 'error'); return; }
      const comment = document.getElementById('reviewComment').value.trim();
      if (!comment) { toast('Please write a comment', 'error'); return; }

      try {
        await api.post(`/properties/${propertyId}/reviews/`, { rating: selectedRating, comment });
        toast('Review submitted!', 'success');
        document.getElementById('reviewForm').style.display = 'none';
        loadReviews();
      } catch (e) {
        toast(e.detail || 'Could not submit review', 'error');
      }
    }

    async function loadReviews() {
      try {
        const reviews = await api.get(`/properties/${propertyId}/reviews/`);
        const stars = n => '<span style="color:#F59E0B">' + '★'.repeat(n) + '</span>' + '☆'.repeat(5 - n);
        const container = document.getElementById('reviewsList');
        if (!reviews.length) {
          container.innerHTML = `<p style="color:var(--mid); font-size:0.9rem">No reviews yet. Be the first to review!</p>`;
          return;
        }
        container.innerHTML = reviews.map(r => `
      <div class="review-card">
        <div class="review-header">
          <div class="reviewer-info">
            <div class="reviewer-avatar">${(r.user_name || 'U')[0].toUpperCase()}</div>
            <div>
              <div style="font-weight:600; font-size:0.9rem">${r.user_name || 'User'}</div>
              <div style="font-size:0.75rem; color:var(--mid)">${new Date(r.created_at).toLocaleDateString('en-IN')}</div>
            </div>
          </div>
          <div>${stars(r.rating)}</div>
        </div>
        <p style="font-size:0.9rem; color:var(--mid)">${r.comment}</p>
      </div>
    `).join('');
      } catch (e) {
        document.getElementById('reviewsList').innerHTML = '';
      }
    }

    function openInquiry() {
      if (!api.isLoggedIn()) {
        toast('Please login to send inquiries', 'error');
        setTimeout(() => window.location.href = 'login.html', 1200);
        return;
      }
      document.getElementById('inquiryDate').min = new Date().toISOString().split('T')[0];
      document.getElementById('inquiryModal').classList.add('open');
    }

    function closeModal() { document.getElementById('inquiryModal').classList.remove('open'); }

    async function sendInquiry() {
      const msg = document.getElementById('inquiryMsg').value.trim();
      const phone = document.getElementById('inquiryPhone').value.trim();
      const date = document.getElementById('inquiryDate').value;
      const alertEl = document.getElementById('inquiryAlert');

      if (!msg || !phone) {
        alertEl.innerHTML = `<div class="alert alert-error">Please fill in all required fields.</div>`;
        return;
      }

      try {
        await api.post('/inquiries/', { property: propertyId, message: msg, contact_number: phone, visit_date: date || null });
        closeModal();
        toast('Inquiry sent! The owner will contact you soon.', 'success');
      } catch (e) {
        alertEl.innerHTML = `<div class="alert alert-error">${e.detail || 'Failed to send inquiry.'}</div>`;
      }
    }

    loadProperty();

    /* ===== Lightbox ===== */
    let _lightboxIdx = 0;

    function openLightbox(idx) {
      const images = window._galleryImages || [];
      if (!images.length) return;
      _lightboxIdx = idx;
      const overlay = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = images[idx];
      document.getElementById('lightboxCounter').textContent = `${idx + 1} / ${images.length}`;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function lightboxNav(dir) {
      const images = window._galleryImages || [];
      if (!images.length) return;
      _lightboxIdx = (_lightboxIdx + dir + images.length) % images.length;
      document.getElementById('lightboxImg').src = images[_lightboxIdx];
      document.getElementById('lightboxCounter').textContent = `${_lightboxIdx + 1} / ${images.length}`;
    }

    // ESC to close
    document.addEventListener('keydown', (e) => {
