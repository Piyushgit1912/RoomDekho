<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Portal – RoomZey Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
  <style>
    .admin-container {
      max-width: 1100px;
      margin: 100px auto 4rem;
      padding: 0 2rem;
    }
    .plan-card {
      background: white;
      border-radius: var(--radius);
      padding: 2.5rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }
    .plan-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
      background: var(--brand);
    }
    .plan-badge {
      display: inline-block;
      background: var(--brand-light);
      color: var(--brand);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .phase-timeline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .phase-card {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.5rem;
      position: relative;
      transition: var(--transition);
    }
    .phase-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-sm);
      border-color: var(--brand);
    }
    .phase-num {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: rgba(255,92,56,0.15);
      font-family: 'Syne', sans-serif;
    }
    .phase-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--dark);
    }
    .phase-desc {
      font-size: 0.85rem;
      color: var(--mid);
      line-height: 1.6;
