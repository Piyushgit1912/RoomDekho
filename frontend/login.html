<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – RoomZey</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">Room<span>Zey</span></a>
    <div class="nav-actions">
      <a href="register.html" class="btn btn-primary">Register</a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-card fade-in">
      <h2 class="form-title">Welcome back 👋</h2>
      <p class="form-subtitle" id="formSubtitle">Sign in to your RoomZey account</p>

      <!-- Role Selection Tabs -->
      <div class="login-tabs">
        <button type="button" class="login-tab active" id="tabTenant" onclick="setLoginMode('tenant')">
          🎓 Tenant Login
        </button>
        <button type="button" class="login-tab" id="tabOwner" onclick="setLoginMode('owner')">
          🏠 Owner Login
        </button>
      </div>
      <input type="hidden" name="user_type" id="userType" value="tenant">

      <div id="alertBox"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password" placeholder="Enter your password"
            autocomplete="current-password">
          <button onclick="togglePassword()"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--mid);font-size:0.9rem"
            id="pwToggle">👁</button>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; margin-bottom:1.5rem">
        <a href="#" style="font-size:0.85rem; color:var(--brand)">Forgot password?</a>
      </div>

      <button class="btn btn-primary btn-full" onclick="doLogin()" id="loginBtn">Sign In</button>

      <div class="form-divider"><span>or continue with</span></div>

      <div style="display:flex; gap:0.75rem">
        <button class="btn btn-outline" style="flex:1; justify-content:center; gap:8px"
          onclick="toast('Google login coming soon!', 'info')">
          <span>G</span> Google
        </button>
        <button class="btn btn-outline" style="flex:1; justify-content:center; gap:8px"
